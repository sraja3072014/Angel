<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angel AI 3D Workshop Stage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #0a1122 0%, #030712 70%, #000000 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e2e8f0;
    }
    #stage-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas#stage-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    /* SVG Overlay for smart leader lines */
    svg#labels-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    /* HTML Cards Overlay for crisp labels */
    #labels-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    .teardown-label {
      position: absolute;
      pointer-events: auto;
      max-width: 240px;
      padding: 8px 12px;
      background: rgba(3, 7, 18, 0.88);
      border: 1px solid rgba(6, 182, 212, 0.45);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 15px rgba(6, 182, 212, 0.15);
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, border-color 0.2s ease, opacity 0.3s ease;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.95);
    }
    .teardown-label.visible {
      opacity: 1;
      transform: scale(1);
    }
    .teardown-label:hover {
      border-color: rgba(6, 182, 212, 0.9);
      box-shadow: 0 4px 25px rgba(6, 182, 212, 0.35);
      transform: scale(1.03);
    }
    .teardown-label .title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .teardown-label .sub {
      font-size: 9px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #94a3b8;
      margin-top: 1px;
    }
    .teardown-label .desc {
      font-size: 10px;
      color: #cbd5e1;
      margin-top: 4px;
      line-height: 1.35;
    }
    /* Subtle Watermark Badge */
    #stage-badge {
      position: absolute;
      bottom: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #94a3b8;
      pointer-events: none;
      z-index: 30;
    }
    #stage-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #06b6d4;
      box-shadow: 0 0 8px #06b6d4;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Vertical Throttle Gauge HUD */
    #throttle-hud {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 220px;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(6, 182, 212, 0.15);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 4px;
      z-index: 25;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }
    #throttle-hud.hidden {
      display: none;
    }
    .hud-title {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #06b6d4;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      margin-bottom: 8px;
    }
    .hud-track {
      flex: 1;
      width: 10px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .hud-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0%;
      background: linear-gradient(to top, #06b6d4 0%, #38bdf8 60%, #ef4444 100%);
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
      transition: height 0.08s ease-out;
    }
    .hud-pct {
      font-size: 9px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      color: #38bdf8;
    }

    /* Gesture status pill on stage */
    #gesture-pill {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #6ee7b7;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #gesture-pill.visible {
      opacity: 1;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "/vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage-container">
    <canvas id="stage-canvas"></canvas>
    <svg id="labels-svg"></svg>
    <div id="labels-container"></div>

    <!-- Vertical Throttle Gauge -->
    <div id="throttle-hud" class="hidden" title="Click or Drag to set Throttle">
      <div class="hud-pct" id="throttle-val">0%</div>
      <div class="hud-track">
        <div class="hud-fill" id="throttle-fill"></div>
      </div>
      <div class="hud-title" id="throttle-label">POWER</div>
    </div>

    <!-- Gesture Status Pill -->
    <div id="gesture-pill">
      <span style="color:#10b981;">✦</span>
      <span id="gesture-text">TRACKING ACTIVE</span>
    </div>

    <div id="stage-badge">
      <div class="dot"></div>
      <span id="badge-text">ANGEL 3D WORKSHOP • 60 FPS</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ========================================================
    // 1. STAGE & RENDERER SETUP
    // ========================================================
    const canvas = document.getElementById('stage-canvas');
    const svgEl = document.getElementById('labels-svg');
    const labelsContainer = document.getElementById('labels-container');
    const badgeText = document.getElementById('badge-text');
    const throttleHud = document.getElementById('throttle-hud');
    const throttleFill = document.getElementById('throttle-fill');
    const throttleVal = document.getElementById('throttle-val');
    const throttleLabel = document.getElementById('throttle-label');
    const gesturePill = document.getElementById('gesture-pill');
    const gestureText = document.getElementById('gesture-text');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 6.5);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance',
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.8;
    controls.maxDistance = 16.0;
    controls.maxPolarAngle = Math.PI * 0.52; // Keep camera above floor
    controls.target.set(0, 0.3, 0);

    // Idle camera auto-rotation management
    let isUserInteracting = false;
    let idleTimer = null;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    controls.addEventListener('start', () => {
      isUserInteracting = true;
      controls.autoRotate = false;
      if (idleTimer) clearTimeout(idleTimer);
    });

    controls.addEventListener('end', () => {
      isUserInteracting = false;
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (!isUserInteracting) controls.autoRotate = true;
      }, 3500);
    });

    // ========================================================
    // 2. STUDIO LIGHTING & REFLECTIVE FLOOR
    // ========================================================
    const ambientLight = new THREE.AmbientLight(0x94a3b8, 0.75);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(4, 7, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const cyanRim = new THREE.DirectionalLight(0x06b6d4, 2.2);
    cyanRim.position.set(-6, 3, -4);
    scene.add(cyanRim);

    const amberRim = new THREE.DirectionalLight(0xf59e0b, 1.8);
    amberRim.position.set(5, 2, -5);
    scene.add(amberRim);

    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.8);
    fillLight.position.set(0, -3, 3);
    scene.add(fillLight);

    // Dark reflective studio pedestal floor
    const floorGeo = new THREE.CylinderGeometry(4.8, 5.0, 0.12, 64);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x050914,
      metalness: 0.85,
      roughness: 0.25,
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.position.y = -1.2;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // Subtle radial floor glow ring
    const ringGeo = new THREE.RingGeometry(4.75, 4.88, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x06b6d4,
      transparent: true,
      opacity: 0.45,
      side: THREE.DoubleSide,
    });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = -Math.PI / 2;
    ringMesh.position.y = -1.13;
    scene.add(ringMesh);

    const baseFloorY = -1.2;

    // ========================================================
    // 3. PROCEDURAL WEB AUDIO SYNTHESIZER
    // ========================================================
    const Synth = {
      ctx: null,
      noiseNode: null,
      noiseFilter: null,
      oscRumble: null,
      oscWhine: null,
      masterGain: null,
      isMuted: false,
      isInitialized: false,

      init() {
        if (this.isInitialized) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();

          // 1. Procedural Noise Buffer (Pink/White blend)
          const bufferSize = this.ctx.sampleRate * 2;
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            output[i] = (b0 + b1 + b2 + white * 0.5362) * 0.12;
          }

          this.noiseNode = this.ctx.createBufferSource();
          this.noiseNode.buffer = noiseBuffer;
          this.noiseNode.loop = true;

          // Bandpass/Lowpass filter for airflow resonance
          this.noiseFilter = this.ctx.createBiquadFilter();
          this.noiseFilter.type = 'lowpass';
          this.noiseFilter.frequency.value = 240;
          this.noiseFilter.Q.value = 3.5;
          this.noiseNode.connect(this.noiseFilter);

          // 2. Dual Oscillators: Low Sub-Rumble + High Turbine Whine
          this.oscRumble = this.ctx.createOscillator();
          this.oscRumble.type = 'sawtooth';
          this.oscRumble.frequency.value = 55;

          const rumbleGain = this.ctx.createGain();
          rumbleGain.gain.value = 0.15;
          this.oscRumble.connect(rumbleGain);

          this.oscWhine = this.ctx.createOscillator();
          this.oscWhine.type = 'sine';
          this.oscWhine.frequency.value = 680;

          const whineGain = this.ctx.createGain();
          whineGain.gain.value = 0.08;
          this.oscWhine.connect(whineGain);

          // 3. Master Gain
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.0; // Start silent

          this.noiseFilter.connect(this.masterGain);
          rumbleGain.connect(this.masterGain);
          whineGain.connect(this.masterGain);
          this.masterGain.connect(this.ctx.destination);

          this.noiseNode.start();
          this.oscRumble.start();
          this.oscWhine.start();
          this.isInitialized = true;
        } catch (e) {
          console.warn('AudioContext init error:', e);
        }
      },

      setSpool(spool) {
        if (!this.isInitialized || !this.ctx || this.isMuted) return;
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        const s = Math.max(0, Math.min(1, spool));
        const now = this.ctx.currentTime;
        
        // Modulate filter cutoff (120Hz at idle to 4200Hz at full thrust)
        const cutoff = 120 + Math.pow(s, 1.8) * 3800;
        this.noiseFilter.frequency.setTargetAtTime(cutoff, now, 0.08);

        // Modulate rumble (45Hz to 160Hz)
        const rumbleFreq = 45 + s * 115;
        this.oscRumble.frequency.setTargetAtTime(rumbleFreq, now, 0.08);

        // Modulate high turbine whine (500Hz to 2800Hz)
        const whineFreq = 500 + Math.pow(s, 1.5) * 2300;
        this.oscWhine.frequency.setTargetAtTime(whineFreq, now, 0.08);

        // Modulate master volume
        const targetGain = s < 0.02 ? 0.0 : (0.05 + s * 0.35);
        this.masterGain.gain.setTargetAtTime(targetGain, now, 0.06);
      },

      setMute(muted) {
        this.isMuted = muted;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(muted ? 0.0 : 0.15, this.ctx.currentTime, 0.05);
        }
      }
    };

    // ========================================================
    // 4. THE COMPLETE "W" BUILDER KIT API (PHASES 1, 2, 3)
    // ========================================================
    const W = {
      parts: [],
      tickCallbacks: [],
      explodeProgress: 0,
      thermalMode: false,
      currentProject: 'Angel_3D_Project',

      // Physics Throttle Engine
      throttleState: {
        active: false,
        target: 0.0,
        current: 0.0,
        spool: 0.0,
        label: 'POWER',
        hasSound: true,
      },

      // Airflow Particle System
      airflowGroup: null,
      airflowParticles: [],
      airflowActive: false,

      telemetry: {
        cpu_percent: 22,
        ram_percent: 45,
        health_score: 95,
        cpu_temp_c: 38.5,
        fan_rpm: 1150,
      },

      materials: {
        brushedSteel: new THREE.MeshStandardMaterial({ color: 0x8f98a3, metalness: 0.85, roughness: 0.32 }),
        titanium: new THREE.MeshStandardMaterial({ color: 0x5a6572, metalness: 0.92, roughness: 0.25 }),
        brass: new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.88, roughness: 0.28 }),
        copper: new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.9, roughness: 0.3 }),
        anodizedBlack: new THREE.MeshStandardMaterial({ color: 0x18181b, metalness: 0.75, roughness: 0.25 }),
        darkAlloy: new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.35 }),
        pcbGreen: new THREE.MeshStandardMaterial({ color: 0x092618, metalness: 0.3, roughness: 0.6 }),
        pcbMatteBlack: new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.4, roughness: 0.5 }),
        chassisDark: new THREE.MeshStandardMaterial({ color: 0x090d16, metalness: 0.6, roughness: 0.45 }),
        glass: new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.28,
          roughness: 0.08,
          transmission: 0.88,
          thickness: 0.4,
        }),
        combustionGlow: new THREE.MeshStandardMaterial({
          color: 0xff6600,
          emissive: 0xff4400,
          emissiveIntensity: 1.8,
          metalness: 0.4,
          roughness: 0.4,
        }),
        heatTintTurbine: new THREE.MeshStandardMaterial({
          color: 0x8b5cf6,
          emissive: 0x4c1d95,
          emissiveIntensity: 0.35,
          metalness: 0.92,
          roughness: 0.22,
        }),
        argbLed: new THREE.MeshBasicMaterial({ color: 0x00f0ff }),
      },

      metal(kind) {
        if (kind === 'titanium') return this.materials.titanium.clone();
        if (kind === 'brass') return this.materials.brass.clone();
        if (kind === 'copper') return this.materials.copper.clone();
        if (kind === 'black') return this.materials.anodizedBlack.clone();
        return this.materials.brushedSteel.clone();
      },

      glass() {
        return this.materials.glass.clone();
      },

      plastic(colorHex) {
        return new THREE.MeshStandardMaterial({
          color: colorHex,
          metalness: 0.1,
          roughness: 0.4,
        });
      },

      add(obj, opts = {}) {
        const id = 'part_' + (this.parts.length + 1);
        const name = opts.name || id;
        const label = opts.label || name;
        const description = opts.description || '';
        const explode = opts.explode || [0, 0, 0];

        obj.castShadow = true;
        obj.receiveShadow = true;
        obj.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            child.userData.partId = id;
            child.userData.partName = name;
          }
        });

        // Compute anchor vertex for teardown label
        let anchor = new THREE.Vector3();
        const bbox = new THREE.Box3().setFromObject(obj);
        bbox.getCenter(anchor);
        if (anchor.lengthSq() < 0.001) {
          anchor.set(bbox.max.x * 0.85, (bbox.max.y + bbox.min.y) * 0.5, bbox.max.z * 0.85);
        }

        const partEntry = {
          id,
          name,
          label,
          description,
          group: obj,
          origPos: obj.position.clone(),
          explodeVec: new THREE.Vector3(...explode),
          anchorLocal: anchor.clone(),
          anchorWorld: new THREE.Vector3(),
          thermalTargets: [],
        };

        // Track thermal-reactive meshes
        obj.traverse((child) => {
          if (child.isMesh && child.material) {
            partEntry.thermalTargets.push({
              mesh: child,
              origColor: child.material.color ? child.material.color.clone() : new THREE.Color(0xffffff),
              origEmissive: child.material.emissive ? child.material.emissive.clone() : new THREE.Color(0x000000),
            });
          }
        });

        this.parts.push(partEntry);
        scene.add(obj);
        return obj;
      },

      onTick(fn) {
        this.tickCallbacks.push(fn);
      },

      // --- THROTTLE ENGINE ---
      throttle(opts = {}) {
        this.throttleState.active = true;
        this.throttleState.label = opts.label || 'POWER';
        this.throttleState.target = opts.start !== undefined ? opts.start : 0.25;
        this.throttleState.spool = this.throttleState.target;
        this.throttleState.hasSound = opts.sound !== false;

        throttleLabel.textContent = this.throttleState.label;
        throttleHud.classList.remove('hidden');

        if (this.throttleState.hasSound) {
          Synth.init();
          Synth.setSpool(this.throttleState.spool);
        }
        return this.throttleState;
      },

      setThrottle(val) {
        const v = Math.max(0, Math.min(1, val));
        this.throttleState.target = v;
      },

      // --- AIRFLOW PARTICLE STREAKS ---
      airflow(opts = {}) {
        if (this.airflowGroup) {
          scene.remove(this.airflowGroup);
          this.airflowGroup = null;
          this.airflowParticles = [];
        }

        const count = opts.count || 240;
        const radius = opts.radius || 1.35;
        const length = opts.length || 5.0;
        const color = opts.color || 0x38bdf8;

        const group = new THREE.Group();
        const streakGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.45, 6);
        const streakMat = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: 0.65,
        });

        for (let i = 0; i < count; i++) {
          const mesh = new THREE.Mesh(streakGeo, streakMat);
          const angle = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * radius;
          mesh.position.set(Math.cos(angle) * r, Math.sin(angle) * r, (Math.random() - 0.5) * length);
          mesh.rotation.x = Math.PI / 2;
          group.add(mesh);

          this.airflowParticles.push({
            mesh,
            baseSpeed: 2.5 + Math.random() * 2.0,
            angle,
            r,
            halfLength: length * 0.5,
          });
        }

        this.airflowGroup = group;
        this.airflowActive = true;
        scene.add(group);
        return group;
      },

      setAirflow(enabled) {
        this.airflowActive = enabled;
        if (this.airflowGroup) {
          this.airflowGroup.visible = enabled;
        }
      },

      // --- ARCHITECTURAL PROCEDURAL FLOORPLAN BENCH ---
      floorplan(plan = {}) {
        const rooms = plan.rooms || [
          { name: 'Living Room', x: -1.5, z: 0, w: 3.2, d: 3.4, floor: 'wood' },
          { name: 'Master Suite', x: 2.0, z: -0.6, w: 2.8, d: 2.6, floor: 'carpet' },
          { name: 'Kitchen & Dining', x: 1.8, z: 1.5, w: 2.4, d: 2.0, floor: 'tile' },
        ];
        const wallH = plan.wallHeight || 1.6;
        const wallThick = plan.wallThick || 0.12;

        const wallMat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          metalness: 0.15,

        });

        const g = new THREE.Group();

        // Build room floors and perimeter walls
        for (const rm of rooms) {
          // Room floor
          let flColor = 0x27272a;
          if (rm.floor === 'wood') flColor = 0x3f2e21;

          const fGeo = new THREE.BoxGeometry(rm.w, 0.04, rm.d);
          const fMat = new THREE.MeshStandardMaterial({ color: flColor, roughness: 0.4, metalness: 0.2 });
          const fMesh = new THREE.Mesh(fGeo, fMat);
          fMesh.position.set(rm.x, -1.14, rm.z);
          fMesh.receiveShadow = true;
          g.add(fMesh);

          // Room perimeter boundary walls
          const halfW = rm.w * 0.5;
          const halfD = rm.d * 0.5;

          const wallConfigs = [
            { w: rm.w, d: wallThick, x: rm.x, z: rm.z - halfD },
            { w: rm.w, d: wallThick, x: rm.x, z: rm.z + halfD },
            { w: wallThick, d: rm.d, x: rm.x - halfW, z: rm.z },
            { w: wallThick, d: rm.d, x: rm.x + halfW, z: rm.z },
          ];

          for (const wc of wallConfigs) {
            const wGeo = new THREE.BoxGeometry(wc.w, wallH, wc.d);
            const wMesh = new THREE.Mesh(wGeo, wallMat);
            wMesh.position.set(wc.x, -1.14 + wallH * 0.5, wc.z);

            wMesh.receiveShadow = true;
            g.add(wMesh);

          label: 'Room Structure & Walls',
          explode: [0, 0.8, 0],

      setExplode(val) {
        this.explodeProgress = Math.max(0, Math.min(1, val));
        let lowestY = 0;

        for (const p of this.parts) {
          p.group.position.copy(p.origPos).addScaledVector(p.explodeVec, this.explodeProgress);
          if (p.group.position.y < lowestY) {
            lowestY = p.group.position.y;
          }
        }

        // Sink floor if parts travel downwards
        floorMesh.position.y = baseFloorY + Math.min(0, lowestY * 0.8);
        ringMesh.position.y = floorMesh.position.y + 0.07;
      },

      setThermalMode(enabled) {
        this.thermalMode = enabled;
        this.applyThermalTint();
      },

      applyThermalTint() {
        const temp = this.telemetry.cpu_temp_c || 40;
        let thermalColor = new THREE.Color(0x06b6d4);
        let emissiveIntensity = 0.2;

        if (temp > 65) {
          thermalColor = new THREE.Color(0xef4444);
          emissiveIntensity = 0.7;
        } else if (temp > 48) {
          thermalColor = new THREE.Color(0xf59e0b);
          emissiveIntensity = 0.45;
        }

        for (const p of this.parts) {
          for (const item of p.thermalTargets) {
            if (item.mesh.material && item.mesh.material.emissive) {
              if (this.thermalMode) {
                item.mesh.material.emissive.copy(thermalColor);
                item.mesh.material.emissiveIntensity = emissiveIntensity;
              } else {
                item.mesh.material.emissive.copy(item.origEmissive);
                item.mesh.material.emissiveIntensity = item.origEmissive.lengthSq() > 0 ? 1.0 : 0.0;
              }
            }
          }
        }
      },

      updateTelemetry(data) {
        Object.assign(this.telemetry, data);
        if (this.thermalMode) this.applyThermalTint();
        badgeText.textContent = `ANGEL 3D WORKSHOP • CPU ${Math.round(this.telemetry.cpu_percent)}% • RAM ${Math.round(this.telemetry.ram_percent)}% • ${Math.round(this.telemetry.cpu_temp_c)}°C`;
      },

      clear() {
        for (const p of this.parts) {
          scene.remove(p.group);
          p.group.traverse((c) => {
            if (c.geometry) c.geometry.dispose();
            if (c.material) {
              if (Array.isArray(c.material)) c.material.forEach((m) => m.dispose());
              else c.material.dispose();
            }
          });
        }
        this.parts = [];
        this.tickCallbacks = [];
        this.explodeProgress = 0;
        this.setExplode(0);

        if (this.airflowGroup) {
          scene.remove(this.airflowGroup);
          this.airflowGroup = null;
          this.airflowParticles = [];
        }

        this.throttleState.active = false;
        throttleHud.classList.add('hidden');

        labelsContainer.innerHTML = '';
        svgEl.innerHTML = '';
      },

      // --- STL 3D PRINT EXPORTER ---
      exportSTL() {
        const files = [];
        const normal = new THREE.Vector3();
        const vA = new THREE.Vector3();
        const vB = new THREE.Vector3();
        const vC = new THREE.Vector3();

        for (const part of this.parts) {
          let stl = `solid ${part.name.replace(/[^a-zA-Z0-9_]/g, '_')}\n`;

          part.group.traverse((child) => {
            if (!child.isMesh || !child.geometry) return;
            const geo = child.geometry.isBufferGeometry ? child.geometry : new THREE.BufferGeometry().fromGeometry(child.geometry);
            const pos = geo.attributes.position;
            const index = geo.index;
            child.updateWorldMatrix(true, false);
            const matrix = child.matrixWorld;

            const writeTriangle = (a, b, c) => {
              vA.fromBufferAttribute(pos, a).applyMatrix4(matrix);
              vB.fromBufferAttribute(pos, b).applyMatrix4(matrix);
              vC.fromBufferAttribute(pos, c).applyMatrix4(matrix);

              const cb = new THREE.Vector3().subVectors(vC, vB);
              const ab = new THREE.Vector3().subVectors(vA, vB);
              normal.crossVectors(cb, ab).normalize();

              stl += `  facet normal ${normal.x.toFixed(5)} ${normal.y.toFixed(5)} ${normal.z.toFixed(5)}\n`;
              stl += `    outer loop\n`;
              stl += `      vertex ${vA.x.toFixed(5)} ${vA.y.toFixed(5)} ${vA.z.toFixed(5)}\n`;
              stl += `      vertex ${vB.x.toFixed(5)} ${vB.y.toFixed(5)} ${vB.z.toFixed(5)}\n`;
              stl += `      vertex ${vC.x.toFixed(5)} ${vC.y.toFixed(5)} ${vC.z.toFixed(5)}\n`;
              stl += `    endloop\n`;
              stl += `  endfacet\n`;
            };

            if (index) {
              for (let i = 0; i < index.count; i += 3) {
                writeTriangle(index.getX(i), index.getX(i + 1), index.getX(i + 2));
              }
            } else if (pos) {
              for (let i = 0; i < pos.count; i += 3) {
                writeTriangle(i, i + 1, i + 2);
              }
            }
          });

          stl += `endsolid ${part.name.replace(/[^a-zA-Z0-9_]/g, '_')}\n`;
          const slug = part.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
          files.push({
            filename: `${slug}.stl`,
            content: stl,
          });
        }

        window.parent.postMessage(
          {
            type: 'EXPORT_STL_PAYLOAD',
            projectName: this.currentProject,
            files,
          },
          '*'
        );
      },
    };

    // ========================================================
    // 5. MEDIAPIPE 3D GLASS HAND SKELETON & GESTURES
    // ========================================================
    const HandRig = {
      group: new THREE.Group(),
      hands: [],
      raycaster: new THREE.Raycaster(),
      mouseVec: new THREE.Vector2(),
      draggedPart: null,
      tetherLine: null,
      lastPinchTime: 0,
      tetherGeo: null,

      init() {
        scene.add(this.group);

        // Tether line for Pinch & Drag
        const lineMat = new THREE.LineBasicMaterial({
          color: 0x06b6d4,
          transparent: true,
          opacity: 0.85,
          linewidth: 2,
        });
        this.tetherGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(),
          new THREE.Vector3(),
        ]);
        this.tetherLine = new THREE.Line(this.tetherGeo, lineMat);
        this.tetherLine.visible = false;
        scene.add(this.tetherLine);

        // Build 2 hand skeletons (21 joint spheres + bone links each)
        for (let h = 0; h < 2; h++) {
          const jointMeshes = [];
          const boneMat = new THREE.MeshPhysicalMaterial({
            color: h === 0 ? 0x06b6d4 : 0x10b981,
            transparent: true,
            opacity: 0.65,
            roughness: 0.1,
            metalness: 0.2,
          });

          for (let j = 0; j < 21; j++) {
            const sphere = new THREE.Mesh(
              new THREE.SphereGeometry(j === 4 || j === 8 ? 0.038 : 0.024, 12, 12),
              boneMat
            );
            sphere.visible = false;
            this.group.add(sphere);
            jointMeshes.push(sphere);
          }

          this.hands.push({
            active: false,
            joints: jointMeshes,
          });
        }
      },

      updateData(handData) {
        if (!handData || !handData.landmarks || handData.landmarks.length === 0) {
          // Hide hands if no data
          for (const h of this.hands) {
            h.active = false;
            for (const j of h.joints) j.visible = false;
          }
          if (this.tetherLine) this.tetherLine.visible = false;
          gesturePill.classList.remove('visible');
          return;
        }

        gesturePill.classList.add('visible');
        if (handData.gestures && handData.gestures.length > 0) {
          gestureText.textContent = handData.gestures.join(' • ').toUpperCase();
        } else {
          gestureText.textContent = 'HAND TRACKING ACTIVE';
        }

        // Process each detected hand
        handData.landmarks.forEach((landmarks, hIdx) => {
          if (hIdx >= this.hands.length) return;
          const rigHand = this.hands[hIdx];
          rigHand.active = true;

          // Convert normalized camera coords [0, 1] to 3D Stage coords
          landmarks.forEach((lm, jIdx) => {
            const sphere = rigHand.joints[jIdx];
            sphere.visible = true;
            // Map: X is inverted for mirror webcam; Y flipped; Z depth
            const x3d = (0.5 - lm.x) * 3.8;
            const y3d = (0.5 - lm.y) * 2.8 + 0.6;
            const z3d = -lm.z * 3.0 + 2.2;
            sphere.position.set(x3d, y3d, z3d);
          });

          // Check Pinch Gesture: thumb tip (4) & index tip (8)
          const thumbTip = rigHand.joints[4].position;
          const indexTip = rigHand.joints[8].position;
          const pinchDist = thumbTip.distanceTo(indexTip);
          const isPinching = pinchDist < 0.12;

          // Raycast from index finger into stage
          const ndcX = -(indexTip.x / 2.0);
          const ndcY = indexTip.y / 2.0;
          this.raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
          const intersects = this.raycaster.intersectObjects(
            W.parts.map((p) => p.group),
            true
          );

          if (intersects.length > 0) {
            let hitPart = null;
            let cur = intersects[0].object;
            while (cur && !hitPart) {
              hitPart = W.parts.find((p) => p.group === cur || p.group.children.includes(cur));
              cur = cur.parent;
            }

            if (hitPart) {
              window.parent.postMessage(
                { type: 'PART_HOVERED', partName: hitPart.name, description: hitPart.description },
                '*'
              );

              // Pinch to drag / tether part
              if (isPinching && !this.draggedPart) {
                this.draggedPart = hitPart;
                const now = performance.now();
                if (now - this.lastPinchTime < 380) {
                  // Double Pinch Event!
                  window.parent.postMessage(
                    { type: 'DOUBLE_PINCH_SPOKEN', partName: hitPart.name, description: hitPart.description },
                    '*'
                  );
                }
                this.lastPinchTime = now;
              }
            }
          }

          if (isPinching && this.draggedPart) {
            // Drag part toward index tip
            this.draggedPart.group.position.lerp(
              new THREE.Vector3(indexTip.x * 0.7, indexTip.y * 0.7, indexTip.z * 0.7),
              0.15
            );
            // Draw tether line
            this.tetherLine.visible = true;
            const posAttr = this.tetherLine.geometry.attributes.position;
            posAttr.setXYZ(0, indexTip.x, indexTip.y, indexTip.z);
            posAttr.setXYZ(1, this.draggedPart.group.position.x, this.draggedPart.group.position.y, this.draggedPart.group.position.z);
            posAttr.needsUpdate = true;
          } else {
            if (this.draggedPart) {
              // Snap back smoothly
              this.draggedPart.group.position.copy(this.draggedPart.origPos);
              this.draggedPart = null;
            }
            if (this.tetherLine) this.tetherLine.visible = false;
          }
        });

        // Two-Hand Pinch & Spread to explode
        if (handData.landmarks.length >= 2) {
          const p1 = this.hands[0].joints[8].position;
          const p2 = this.hands[1].joints[8].position;
          const dist = p1.distanceTo(p2);
          // Map distance ~0.4m -> 1.8m to explode 0.0 -> 1.0
          const exp = Math.max(0, Math.min(1, (dist - 0.5) / 1.1));
          W.setExplode(exp);
        }

        // Fist gesture: boost throttle
        if (handData.gestures && handData.gestures.includes('Fist')) {
          W.setThrottle(1.0);
        }

        // Peace sign: reset explode
        if (handData.gestures && handData.gestures.includes('Peace')) {
          W.setExplode(0);
        }
      },
    };
    HandRig.init();

    const ImageBench = {

      loadReference(dataUrl) {
        if (this.plane) scene.remove(this.plane);
        if (this.scanline) scene.remove(this.scanline);

        const loader = new THREE.TextureLoader();
        loader.load(dataUrl, (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          const geo = new THREE.PlaneGeometry(3.6, 2.7);
          const mat = new THREE.MeshBasicMaterial({
            map: tex,
            transparent: true,
            opacity: 0.75,
            side: THREE.DoubleSide,
          });

          this.plane = new THREE.Mesh(geo, mat);
          this.plane.position.set(0, 0.4, -0.6);
          scene.add(this.plane);

          // Sci-Fi Scanline laser sweep
          const scanGeo = new THREE.BoxGeometry(3.7, 0.03, 0.02);
          const scanMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
          this.scanline = new THREE.Mesh(scanGeo, scanMat);
          this.scanline.position.set(0, 1.7, -0.58);
          scene.add(this.scanline);

          let startY = 1.7;
          let scanTimer = performance.now();
          const sweep = () => {
            const elapsed = (performance.now() - scanTimer) / 1000;
            if (elapsed < 2.5) {
              const y = startY - (elapsed / 2.5) * 2.7;
              if (this.scanline) this.scanline.position.y = y;
              requestAnimationFrame(sweep);
            } else {
              // Fade scanline
              if (this.scanline) scene.remove(this.scanline);
              if (this.plane) {
                // Dim down reference as solid models take over
                this.plane.material.opacity = 0.35;
              }
            }
          };
          requestAnimationFrame(sweep);
        });
      },

        name: 'High-Pressure Turbine Blisk',
        label: 'TURBINE EXTRACTOR',
        explode: [0, 0, -1.6],
        description: 'Single-crystal superalloy blades extracting kinetic energy from expanding exhaust gas to drive the front fan spool.',
      });
      rotators.push({ group: turbGroup, speedMul: 5.2 });

      // PART 5: Aerodynamic Nacelle Cowling Cutaway
      const cowlGroup = new THREE.Group();
      const cowlGeo = new THREE.CylinderGeometry(1.3, 1.15, 2.6, 48, 1, true, 0, Math.PI * 1.35);
      const cowlMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        metalness: 0.85,
        roughness: 0.2,
        side: THREE.DoubleSide,
      });
      const cowlMesh = new THREE.Mesh(cowlGeo, cowlMat);
      cowlMesh.rotation.x = Math.PI / 2;
      cowlMesh.position.z = 0.2;
      cowlGroup.add(cowlMesh);
      W.add(cowlGroup, {
        name: 'Nacelle Aerodynamic Cowling',
        label: 'NACELLE CUTAWAY',
        explode: [1.6, 0.4, 0],
        description: 'Carbon-composite acoustic cowling guiding bypass airflow and isolating engine core thermal zones.',
      });

      // PART 6: Variable Exhaust Nozzle & Tailcone
      const exhaustGroup = new THREE.Group();
      const coneGeo = new THREE.ConeGeometry(0.38, 1.2, 32);
      const coneMesh = new THREE.Mesh(coneGeo, W.metal('titanium'));
      coneMesh.rotation.x = -Math.PI / 2;
      coneMesh.position.z = -1.6;
      exhaustGroup.add(coneMesh);

      const nozzleRing = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.68, 0.4, 32, 1, true), W.metal('black'));
      nozzleRing.rotation.x = Math.PI / 2;
      nozzleRing.position.z = -1.4;
      exhaustGroup.add(nozzleRing);
      W.add(exhaustGroup, {
        name: 'Variable Exhaust Nozzle',
        label: 'EXHAUST CONE',
        explode: [-1.4, -0.6, -1.0],
        description: 'Convergent exhaust mixing core jet gas with cooler bypass stream for optimal thermal acoustic attenuation.',
      });

      // Spool & Dynamic Rotation Ticks
      W.onTick((delta) => {
        // Inertial spool physics
        const spoolSpeed = 1.6;
        W.throttleState.spool += (W.throttleState.target - W.throttleState.spool) * (delta * spoolSpeed);
        
        // Update audio synth
        if (W.throttleState.hasSound) {
          Synth.setSpool(W.throttleState.spool);
        }

        // Update HUD
        const pct = Math.round(W.throttleState.spool * 100);
        throttleVal.textContent = `${pct}%`;
        throttleFill.style.height = `${pct}%`;

        // Rotate spools scaled by throttle spool
        const rotMultiplier = 0.8 + W.throttleState.spool * 4.5;
        for (const r of rotators) {
          r.group.rotation.z += delta * r.speedMul * rotMultiplier;
        }

        // Airflow streaks animation
        if (W.airflowActive && W.airflowParticles.length > 0) {
          const speed = (2.0 + W.throttleState.spool * 12.0) * delta;
          for (const p of W.airflowParticles) {
            p.mesh.position.z -= p.baseSpeed * speed;
            if (p.mesh.position.z < -p.halfLength) {
              p.mesh.position.z = p.halfLength;
            }
          }
        }
      });
    }

    // BUILD 2: LIVE TELEMETRY GAMING PC DIGITAL TWIN
    function buildGamingPCDigitalTwin() {
      W.clear();
      W.currentProject = 'Gaming_PC_Digital_Twin';

      const fans = [];

      // PART 1: Chassis Frame & Cable Management Backplane
      const chassisGroup = new THREE.Group();
      const chassisMat = W.materials.chassisDark;
      const frameGeo = new THREE.BoxGeometry(1.6, 2.2, 2.2);
      const frameWire = new THREE.BoxGeometry(1.62, 2.22, 2.22);
      const frameMesh = new THREE.Mesh(frameWire, new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true, transparent: true, opacity: 0.15 }));
      chassisGroup.add(frameMesh);

      const psuShroud = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.45, 2.1), chassisMat);
      psuShroud.position.set(0, -0.85, 0);
      chassisGroup.add(psuShroud);
      W.add(chassisGroup, {
        name: 'Chassis Chassis Frame',
        label: 'ALUMINUM CHASSIS',
        explode: [0, -1.2, 0],
        description: 'Anodized dual-chamber steel and aluminum unibody with modular mounting channels.',
      });

      // PART 2: ATX Motherboard & VRM Heat Sinks
      const moboGroup = new THREE.Group();
      const moboMesh = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.4, 1.4), W.materials.pcbMatteBlack);
      moboMesh.position.set(-0.65, 0.15, 0);
      moboGroup.add(moboMesh);

      const vrmGeo = new THREE.BoxGeometry(0.14, 0.35, 0.28);
      const vrmMesh = new THREE.Mesh(vrmGeo, W.metal('titanium'));
      vrmMesh.position.set(-0.55, 0.6, -0.4);
      moboGroup.add(vrmMesh);
      W.add(moboGroup, {
        name: 'ATX Mainboard PCB & VRM',
        label: 'MOTHERBOARD CORE',
        explode: [-1.4, 0, 0],
        description: '14-layer PCIe Gen 5 host mainboard supporting direct processor communication lanes.',
      });

      // PART 3: 24-Core Flagship Processor & AIO Liquid Pump Block
      const cpuGroup = new THREE.Group();
      const cpuIhs = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.24, 0.24), W.metal('copper'));
      cpuIhs.position.set(-0.6, 0.35, -0.15);
      cpuGroup.add(cpuIhs);

      const pumpGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.14, 32);
      const pumpMesh = new THREE.Mesh(pumpGeo, W.metal('black'));
      pumpMesh.rotation.z = Math.PI / 2;
      pumpMesh.position.set(-0.5, 0.35, -0.15);
      cpuGroup.add(pumpMesh);

      const ringLed = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.16, 32), W.materials.argbLed);
      ringLed.rotation.y = Math.PI / 2;
      ringLed.position.set(-0.42, 0.35, -0.15);
      cpuGroup.add(ringLed);
      W.add(cpuGroup, {
        name: 'CPU & AIO Liquid Pump Block',
        label: 'PROCESSOR WATERBLOCK',
        explode: [0, 1.2, 0],
        description: 'Micro-skived copper cold plate coupled with low-cavitation PWM liquid impeller.',
      });

      // PART 4: GPU Graphics Accelerator
      const gpuGroup = new THREE.Group();
      const gpuShroud = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.55, 1.35), W.metal('titanium'));
      gpuShroud.position.set(-0.15, 0.05, 0.15);
      gpuGroup.add(gpuShroud);

      const backplate = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.52, 1.3), W.metal('black'));
      backplate.position.set(-0.34, 0.05, 0.15);
      gpuGroup.add(backplate);

      for (let f = 0; f < 3; f++) {
        const fanMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.04, 16), W.metal('black'));
        fanMesh.rotation.z = Math.PI / 2;
        fanMesh.position.set(0.04, 0.05, -0.35 + f * 0.42);
        gpuGroup.add(fanMesh);
        fans.push({ mesh: fanMesh, baseSpeed: 8.5 });
      }
      W.add(gpuGroup, {
        name: 'Flagship GPU Graphics Card',
        label: 'GRAPHICS ACCELERATOR',
        explode: [0, 0, 1.5],
        description: 'Vapor-chamber cooled triple-axial graphics card maintaining high-fps compute throughput.',
      });

      // PART 5: Front Intake & Top 360mm Radiator Fans
      const coolingGroup = new THREE.Group();
      for (let i = 0; i < 3; i++) {
        const radFan = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 24), W.materials.argbLed);
        radFan.position.set(-0.4 + i * 0.45, 1.05, 0);
        coolingGroup.add(radFan);
        fans.push({ mesh: radFan, baseSpeed: 9.0 });
      }
      W.add(coolingGroup, {
        name: '360mm Liquid Cooling Radiator',
        label: 'COOLING FANS',
        explode: [0, 1.5, 0],
        description: 'High-static-pressure ARGB fan array dissipating thermal energy across aluminum heat fins.',
      });

      // PART 6: Tempered Glass Panoramic Window
      const glassGroup = new THREE.Group();
      const glassPane = new THREE.Mesh(new THREE.BoxGeometry(0.04, 2.1, 2.1), W.glass());
      glassPane.position.set(0.78, 0, 0);
      glassGroup.add(glassPane);
      W.add(glassGroup, {
        name: 'Panoramic Tempered Glass Panel',
        label: 'GLASS SHOWCASE',
        explode: [1.8, 0, 0],
        description: 'Electro-coated 4mm acoustic tempered glass providing optical showcase clarity.',
      });

      // Fan Rotation Dynamic Tick
      W.onTick((delta) => {
        const rpmFactor = (W.telemetry.fan_rpm || 1100) / 1000;
        for (const fan of fans) {
          fan.mesh.rotation.x += delta * fan.baseSpeed * rpmFactor;
        }
      });
    }

    // ========================================================
    // 8. TEARDOWN LABELS & SCREEN POSITION MAPPING
    // ========================================================
    const tempVec = new THREE.Vector3();

    function updateTeardownLabels() {
      if (W.parts.length === 0) {
        labelsContainer.innerHTML = '';
        svgEl.innerHTML = '';
        return;
      }

      const isMobile = window.innerWidth < 640;
      if (isMobile) {
        labelsContainer.innerHTML = '';
        svgEl.innerHTML = '';
        return;
      }

      const activeParts = [];
      for (const p of W.parts) {
        p.group.updateWorldMatrix(true, false);
        p.anchorWorld.copy(p.anchorLocal).applyMatrix4(p.group.matrixWorld);

        tempVec.copy(p.anchorWorld).project(camera);
        if (tempVec.z < 1.0) {
          const screenX = (tempVec.x * 0.5 + 0.5) * window.innerWidth;
          const screenY = (-(tempVec.y * 0.5) + 0.5) * window.innerHeight;
          activeParts.push({
            part: p,
            screenX,
            screenY,
            depth: tempVec.z,
          });
        }
      }

      activeParts.sort((a, b) => a.screenY - b.screenY);
      const half = Math.ceil(activeParts.length / 2);
      const leftParts = activeParts.slice(0, half);
      const rightParts = activeParts.slice(half);

      let svgHTML = '';
      let domHTML = '';
      const opacity = Math.min(1, Math.max(0.15, W.explodeProgress * 1.5));

      function layoutColumn(columnParts, isLeft) {
        const cardX = isLeft ? 18 : window.innerWidth - 258;
        const totalHeight = window.innerHeight - 140;
        const verticalGap = Math.max(48, Math.min(84, totalHeight / Math.max(1, columnParts.length)));

        columnParts.forEach((item, idx) => {
          const cardY = 55 + idx * verticalGap;
          const anchorPointX = item.screenX;
          const anchorPointY = item.screenY;
          const attachPointX = isLeft ? cardX + 240 : cardX;
          const attachPointY = cardY + 24;

          svgHTML += `
            <circle cx="${anchorPointX}" cy="${anchorPointY}" r="4" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" opacity="${opacity}" />
            <polyline points="${anchorPointX},${anchorPointY} ${attachPointX},${attachPointY}" 
                      fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" opacity="${opacity * 0.85}" />
          `;

          domHTML += `
            <div class="teardown-label visible" 
                 style="left: ${cardX}px; top: ${cardY}px; opacity: ${opacity};"
                 onclick="window.parent.postMessage({ type: 'PART_CLICKED', partName: '${item.part.name}', description: '${item.part.description.replace(/'/g, "\\'")}' }, '*')"
                 onmouseenter="window.parent.postMessage({ type: 'PART_HOVERED', partName: '${item.part.name}', description: '${item.part.description.replace(/'/g, "\\'")}' }, '*')">
              <div class="title">
                <span>${item.part.name}</span>
                <span style="color:#06b6d4;">✦</span>
              </div>
              <div class="sub">${item.part.label}</div>
              <div class="desc">${item.part.description}</div>
            </div>
          `;
        });
      }

      layoutColumn(leftParts, true);
      layoutColumn(rightParts, false);

      svgEl.innerHTML = svgHTML;
      labelsContainer.innerHTML = domHTML;
    }

    // ========================================================
    // 9. RENDER LOOP WITH NaN / HDR GUARD PASS
    // ========================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      // Guard check
      if (isNaN(camera.position.x) || isNaN(camera.position.y) || isNaN(camera.position.z)) {
        camera.position.set(0, 2.5, 6.5);
      }
      if (isNaN(controls.target.x)) {
        controls.target.set(0, 0, 0);
      }

      controls.update();

      // Run registered ticks
      for (const cb of W.tickCallbacks) {
        try {
          cb(delta);
        } catch (e) {
          console.warn('Tick error:', e);
        }
      }

      renderer.render(scene, camera);
      updateTeardownLabels();
    }
    animate();

    // ========================================================
    // 10. WINDOW RESIZE HANDLING
    // ========================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ========================================================
    // 11. POSTMESSAGE COMMUNICATION FROM REACT PARENT
    // ========================================================
    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (!data || !data.type) return;

      switch (data.type) {
        case 'LOAD_SHOWPIECE':
          if (data.showpiece === 'gaming_pc') {
            buildGamingPCDigitalTwin();
          } else {
            buildTurbofanJetEngine();
          }
          break;

        case 'CLEAR_STAGE':
          W.clear();
          break;

        case 'RUN_PART': {
          const { partName, code } = data;
          try {
            const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
            const runner = new AsyncFunction('W', 'THREE', 'scene', 'camera', code);
            await runner(W, THREE, scene, camera);
            window.parent.postMessage({ type: 'PART_SUCCESS', partName }, '*');
          } catch (err) {
            console.error('Part execution error in part:', partName, err);
            window.parent.postMessage({
              type: 'PART_ERROR',
              partName,
              code,
              error: err.message || String(err),
            }, '*');
          }
          break;
        }

        case 'SET_THROTTLE':
          W.setThrottle(Number(data.value));
          break;

        case 'SET_AIRFLOW':
          W.setAirflow(Boolean(data.enabled));
          break;

        case 'SET_SYNTH_MUTE':
          Synth.setMute(Boolean(data.muted));
          break;

        case 'LOAD_REFERENCE_IMAGE':
          if (data.dataUrl) {
            ImageBench.loadReference(data.dataUrl);
          }
          break;

        case 'HAND_LANDMARKS_DATA':
          HandRig.updateData(data);
          break;

        case 'SET_EXPLODE':
          W.setExplode(data.value);
          break;

        case 'TOGGLE_EXPLODE':
          const target = W.explodeProgress > 0.5 ? 0 : 1;
          const startVal = W.explodeProgress;
          const startTime = performance.now();
          const duration = 750;
          function step(now) {
            const t = Math.min(1, (now - startTime) / duration);
            const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
            W.setExplode(startVal + (target - startVal) * ease);
            if (t < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
          break;

        case 'SET_THERMAL':
          W.setThermalMode(Boolean(data.enabled));
          break;

        case 'TELEMETRY_UPDATE':
          W.updateTelemetry(data.telemetry || {});
          break;

        case 'TRIGGER_EXPORT_STL':
          W.exportSTL();
          break;

        case 'RESET_CAMERA':
          camera.position.set(0, 2.5, 6.5);
          controls.target.set(0, 0, 0);
          controls.update();
          break;

        default:
          break;
      }
    });

    // Load initial default showpiece: Turbofan Jet Engine
    buildTurbofanJetEngine();

    // Inform parent that stage is loaded and ready
    window.parent.postMessage({ type: 'STAGE_READY' }, '*');
  </script>
</body>
